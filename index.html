<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>

<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; }
  canvas { display:block; }

  /* Pantalla de inicio (necesaria para que el navegador permita el audio) */
  #startOverlay {
    position:fixed; inset:0; z-index:2000; background:#000; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center; padding:20px; box-sizing:border-box;
  }
  #startBtn {
    display:none; padding:14px 34px; font-size:18px; cursor:pointer;
    background:#000; color:#fff; border:1px solid #fff; border-radius:4px;
  }
  #startBtn:hover { background:#fff; color:#000; }
  #startMsg { font-size:14px; opacity:.8; max-width:420px; line-height:1.4; }

  /* Botón para mostrar/ocultar el panel */
  #panelToggle {
    position:fixed; top:10px; right:10px; z-index:1500;
    width:34px; height:34px; border-radius:50%;
    background:#000; color:#fff; border:1px solid #666;
    font-size:18px; line-height:1; cursor:pointer; opacity:.35;
  }
  #panelToggle:hover { opacity:1; }

  /* Ventana flotante de controles */
  #controlFrame {
    position:fixed; top:60px; left:20px; width:270px; z-index:1600;
    background:rgba(0,0,0,.92); border:1px solid #555; border-radius:6px;
    color:#fff; box-shadow:0 4px 18px rgba(0,0,0,.6); font-size:13px;
  }
  #controlFrame.hidden { display:none; }
  #controlHeader {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:#222; border-radius:6px 6px 0 0;
    cursor:grab; user-select:none; touch-action:none;
  }
  #controlHeader:active { cursor:grabbing; }
  #controlHide { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1; }
  #controlBody { padding:10px 12px 12px; }
  .control-item { margin-bottom:10px; }
  .control-item label { display:block; margin-bottom:3px; }
  input[type="color"] { width:100%; height:30px; border:none; background:none; padding:0; }
  input[type="range"] { width:100%; }
  .toggles { display:flex; gap:14px; flex-wrap:wrap; }
  .toggles label { display:flex; align-items:center; gap:5px; }
</style>
</head>

<body>

<div id="startOverlay">
  <div id="startMsg">Cargando…</div>
  <button id="startBtn">▶ Iniciar</button>
</div>

<button id="panelToggle" title="Mostrar/ocultar controles">⚙</button>

<div id="controlFrame" class="hidden">
  <div id="controlHeader">
    <span>Controles</span>
    <button id="controlHide" title="Ocultar">✕</button>
  </div>
  <div id="controlBody">
    <div class="control-item"><label>BG Color</label>
      <input type="color" id="bgColor" value="#000000"></div>
    <div class="control-item"><label>Visualizer stars Color</label>
      <input type="color" id="visColor" value="#ffffff"></div>
    <div class="control-item"><label>Stars Void Color</label>
      <input type="color" id="starColor" value="#ffffff"></div>
    <div class="control-item"><label>Volume</label>
      <input type="range" id="volumeI" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="control-item"><label>Vibración (guitarra, mano, void)</label>
      <input type="range" id="vibI" min="0" max="1" step="0.01" value="1"></div>
    <div class="toggles">
      <label><input type="checkbox" id="posterize"> Posterize</label>
      <label><input type="checkbox" id="blur"> Blur</label>
      <label><input type="checkbox" id="negative"> Negative</label>
    </div>
  </div>
</div>

<script>
// ============ CONFIGURACIÓN ============
// Si en Wix solo pegas este HTML, las imágenes y los mp3 no se encuentran
// con rutas relativas. Sube la carpeta del proyecto a un hosting y pon aquí
// su URL completa terminada en "/", por ejemplo:
// const ASSET_BASE = "https://tuusuario.github.io/mi-proyecto/";
const ASSET_BASE = "";
// =======================================

// Cada valor aleatorio se mantiene VIB_HOLD fotogramas antes de cambiar
// (el original cambiaba en cada fotograma = 1). Sube el número para vibrar más lento.
const VIB_HOLD = 5;
console.log("PF: vibración aleatoria cada " + VIB_HOLD + " fotogramas");
let vibAmp = 1; // 1 = rango original; lo controla el slider del panel

// Número pseudoaleatorio estable durante VIB_HOLD fotogramas, en [0,1)
function hr(seed, k) {
  let x = (Math.floor(frameCount / VIB_HOLD) * 374761393 + seed * 668265263 + k * 1274126177) | 0;
  x = Math.imul(x ^ (x >>> 15), 2246822519);
  x = Math.imul(x ^ (x >>> 13), 3266489917);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

// Equivale a random(a, b) pero cambia solo cada VIB_HOLD fotogramas
function vib(seed, a, b, k = 0) {
  const raw = a + (b - a) * hr(seed, k);
  const c = (a + b) / 2;
  return c + (raw - c) * vibAmp;
}

let audioReady = false;
let setupDone = false;
const failedAssets = [];

function fail(name) {
  failedAssets.push(name);
  setStartMsg("No se pudo cargar: " + failedAssets.join(", ") +
    ". Revisa ASSET_BASE y que los archivos estén subidos.");
}
function setStartMsg(t) { document.getElementById("startMsg").textContent = t; }
function L(name) { return loadImage(ASSET_BASE + name, null, () => fail(name)); }
function S(name) { return loadSound(ASSET_BASE + name, null, () => fail(name)); }

setTimeout(() => {
  if (!setupDone && failedAssets.length === 0) {
    setStartMsg("Está tardando mucho en cargar. Revisa ASSET_BASE y tu conexión.");
  }
}, 15000);

let bgColor;
let starColor;
let visColor;

let posterize = false;
let blur = false;
let negative = false;

let volumeI = 0.5;

let pluged = false;
let start = false;
let time = 0;

let isPlaying = false;

let altavoz;
let altavoz2;
let plug;

let guitar;
let hand;

let tv1;
let tv2;
let tv3;
let tv4;
let tv5;

let lyrics1;
let lyrics2;
let lyrics3;
let lyrics4;
let lyrics5;
let lyrics6;

let tv_bg1;
let tv_bg2;

let efecto = [];
let currentFrame = 0;

let portada;
let portada2;

let tw1;
let tw1_2;
let tw1_3;

let tw2;
let tw3;
let tw4;
let tw5;

let tw2_2;
let tw3_2;
let tw4_2;
let tw5_2;

let crucificar = [];

let indiceCruz = 0;
let maxEnter = 8;
let canEnter = false;

let silhouette;
let silhouette2;
let silhouette3;
let alpha;

let songInst;
let songVocal;
let fft;

let bands = 64;
let spectrum = [];

let numberOfStars = 20000;
let newStars = 50;
let starArray = [];

let w2;
let h2;
let d2;

let numCircles = 20;
let maxRadius;
let radii = [];
let angles = [];
let speeds = [];

let numStars = 2500;
let starAngles = [];
let starRadii = [];

class star {
  constructor() {
    this.x = random(width);
    this.y = random(height);
    this.speed = random(0.2, 5);
    this.wachsen = int(random(0, 2));

    if (this.wachsen == 1) {
      this.d = 0;
    } else {
      this.d = random(0.2, 3);
    }

    this.age = 0;
    this.sizeIncr = random(0, 0.03);
  }

  render() {
    this.age++;

    if (this.age < 200) {
      if (this.wachsen == 1) {
        this.d += this.sizeIncr;

        if (this.d > 3 || this.d < -3) {
          this.d = 3;
        }
      } else {
        if (this.d > 3 || this.d < -3) {
          this.d = 3;
        }

        this.d = this.d + 0.2 - 0.6 * noise(this.x, this.y, frameCount);
      }
    } else {
      if (this.d > 3 || this.d < -3) {
        this.d = 3;
      }
    }

    let size = this.d * map(
      noise(this.x, this.y, 0.001 * frameCount),
      0, 1, 0.2, 1.5
    );

    ellipse(this.x, this.y, size, size);
  }

  move() {
    this.x = this.x - map(
      1920, 0, width,
      -0.05 * this.speed, 0.05 * this.speed
    ) * (w2 - this.x);

    this.y = this.y - map(
      mouseY + 750, 0, height,
      -0.05 * this.speed, 0.05 * this.speed
    ) * (h2 - this.y);
  }
}

function preload() {
  altavoz = L("altavoz.png");
  altavoz2 = L("altavoz2.png");
  plug = L("plug.png");

  guitar = L("guitar.png");
  hand = L("hand.png");

  tv1 = L("lyrics_lies.png");
  tv2 = L("lyrics_underneath.png");
  tv3 = L("lyrics_changing.png");
  tv4 = L("lyrics_cleansing.png");
  tv5 = L("lyrics_forget.png");

  tv_bg1 = L("lyrics_bg0.png");
  tv_bg2 = L("lyrics_bg1.png");

  efecto[0] = L("lyrics_bg0.png");
  efecto[1] = L("lyrics_bg1.png");
  efecto[2] = L("lyrics_bg2.png");
  efecto[3] = L("lyrics_bg3.png");

  lyrics1 = L("lyrics_confuse.png");
  lyrics2 = L("lyrics_lose.png");
  lyrics3 = L("lyrics_game.png");
  lyrics4 = L("lyrics_change.png");
  lyrics5 = L("lyrics_replace.png");
  lyrics6 = L("lyrics_forget2.png");

  portada = L("portada.png");
  portada2 = L("portada2.png");

  tw1 = L("lyrics_plug.png");
  tw1_2 = L("lyrics_plug.png");
  tw1_3 = L("lyrics_plug.png");

  tw2 = L("lyrics_crucifies.png");
  tw3 = L("lyrics_tired.png");
  tw4 = L("lyrics_unbroken.png");
  tw5 = L("lyrics_living.png");

  tw2_2 = L("lyrics_crucifies.png");
  tw3_2 = L("lyrics_tired.png");
  tw4_2 = L("lyrics_unbroken.png");
  tw5_2 = L("lyrics_living.png");

  for (let i = 0; i < 8; i++) {
    crucificar[i] = L("cristo" + i + ".png");
  }

  silhouette = L("silhouette.png");
  silhouette2 = L("silhouette2.png");
  silhouette3 = L("silhouette3.png");
  alpha = L("alpha.png");

  soundFormats("mp3");
  songInst = S("plugInBaby.mp3");
  songVocal = S("PIB_Voice.mp3");
}

function setup() {
  createCanvas(1920, 1080);
  noStroke();
  fitCanvas();
  cacheControls();
  prepareStart();
  setupDone = true;

  bgColor = color(0, 0, 0, 255);
  visColor = color(255, 255, 255, 255);
  starColor = color(255, 255, 255, 255);

  for (let i = 0; i < bands; i++) {
    spectrum[i] = 0;
  }

  fft = new p5.FFT(0.9, bands);

  w2 = width / 2;
  h2 = height / 2;
  d2 = dist(0, 0, w2, h2);

  starArray.push(new star());

  maxRadius = width / 2;

  for (let i = 0; i < numCircles; i++) {
    radii[i] = map(i, 0, numCircles - 1, 50, maxRadius);
    angles[i] = random(TWO_PI);
    speeds[i] = map(i, 0, numCircles - 1, 0.005, 0.005);
  }

  for (let i = 0; i < numStars; i++) {
    starAngles[i] = random(TWO_PI);
    starRadii[i] = random(100, width);
  }
}

function draw() {
  leerControles();

  if (!audioReady) {
    background(bgColor);
    return;
  }

  background(bgColor);
  image(altavoz, 0, 0, width, height);
  filters();

  if (pluged == false) {
    strokeWeight(5);
    stroke(255);
    line(1200, 725, mouseX, mouseY);

    image(plug, mouseX - 25, mouseY - 31, 51, 52);
    filters();

    if (
      1350 >= mouseX && mouseX >= 1250 &&
      620 >= mouseY && mouseY >= 520
    ) {
      background(bgColor);
      image(altavoz2, 0, 0, width, height);

      pluged = true;
      time = millis();

      filters();
    }
  }

  if (pluged == true) {
    background(bgColor);
    image(altavoz2, 0, 0, width, height);
    filters();

    if (start == false) {
      songInst.play();
      songInst.amp(volumeI);
      start = true;
    }
  }

  if (start) {
    songInst.amp(volumeI);

    if (millis() - time > 5200) {
      background(bgColor);
      isPlaying = true;

      image(guitar, 0, 0, width, height);
      image(hand, mouseX - 25, mouseY - 31, 252, 391);
      filters();

      if (
        1400 >= mouseX && mouseX >= 900 &&
        700 >= mouseY && mouseY >= 200 &&
        isPlaying == true
      ) {
        spectrum = fft.analyze();

        background(bgColor);
        songInst.amp(volumeI);

        for (let i = 0; i < bands; i++) {
          let ellipseSize = map(spectrum[i], 0, 255, 400, 2000);

          fill(vib(20 + i, 0, 255), 0, 0);
          stroke(vib(220 + i, 0, 255), 0, 0);

          ellipse(width / 2, height / 2, ellipseSize, ellipseSize);
        }

        image(
          guitar,
          0, 0,
          vib(1, width - 30, width),
          vib(2, height - 30, height)
        );

        image(
          hand,
          mouseX - 25, mouseY - 31,
          vib(3, 230, 252),
          vib(4, 370, 391)
        );

        filters();
      }
    }

    if (millis() - time > 32000) {
      isPlaying = false;

      image(efecto[currentFrame], 0, 0);
      filters();

      if (frameCount % 5 == 0) {
        currentFrame = (currentFrame + 1) % efecto.length;
      }

      image(tv1, 0, 0, width, height);
      filters();

      if (millis() - time > 38500) {
        image(tv2, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 43000) {
        image(tv3, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 49000) {
        image(tv4, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 53000) {
        image(tv5, 0, 0, width, height);
        filters();
      }
    }

    if (millis() - time > 62000) {
      background(bgColor);

      fill(
        255,
        map(dist(mouseX, mouseY, w2, h2), 0, d2, 255, -10)
      );

      stroke(visColor);

      starArray[0].render();

      for (let i = 0; i < newStars; i++) {
        starArray.push(new star());
      }

      for (let i = starArray.length - 1; i >= 0; i--) {
        if (
          starArray[i].x < 0 ||
          starArray[i].x > width ||
          starArray[i].y < 0 ||
          starArray[i].y > height
        ) {
          starArray.splice(i, 1);
        } else {
          starArray[i].move();
          starArray[i].render();
        }
      }

      if (starArray.length > numberOfStars) {
        for (let i = 0; i < newStars; i++) {
          starArray.splice(0, 1);
        }
      }

      fill(255);

      image(portada, 0, 0, width, height);
      image(tw1, 0, 0, width, height);

      canEnter = true;
      filters();

      for (let i = 0; i < indiceCruz && -1 < indiceCruz; i++) {
        image(crucificar[i], 0, 0, width, height);
        filters();
      }

      if (millis() - time > 67000) {
        tw1 = tw2;
        filters();
      }

      if (millis() - time > 70000) {
        tw1 = tw3;
        filters();
      }

      if (millis() - time > 77000) {
        tw1 = tw1_2;
        filters();
      }

      if (millis() - time > 81000) {
        tw1 = tw4;
        filters();
      }

      if (millis() - time > 84500) {
        tw1 = tw5;
        filters();
      }
    }

    filters();

    if (millis() - time > 106500) {
      background(bgColor);
      image(efecto[currentFrame], 0, 0);

      if (frameCount % 5 == 0) {
        currentFrame = (currentFrame + 1) % efecto.length;
      }

      image(lyrics1, 0, 0, width, height);
      filters();

      if (millis() - time > 110000) {
        image(lyrics2, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 114000) {
        image(lyrics3, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 120000) {
        image(lyrics4, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 124000) {
        image(lyrics5, 0, 0, width, height);
        filters();
      }

      if (millis() - time > 127500) {
        background(bgColor);
        image(lyrics6, 0, 0, width, height);
        filters();
      }
    }

    if (millis() - time > 136500) {
      background(bgColor);

      fill(
        255,
        map(dist(mouseX, mouseY, w2, h2), 0, d2, 255, -10)
      );

      stroke(visColor);

      starArray[0].render();

      for (let i = 0; i < newStars; i++) {
        starArray.push(new star());
      }

      for (let i = starArray.length - 1; i >= 0; i--) {
        if (
          starArray[i].x < 0 ||
          starArray[i].x > width ||
          starArray[i].y < 0 ||
          starArray[i].y > height
        ) {
          starArray.splice(i, 1);
        } else {
          starArray[i].move();
          starArray[i].render();
        }
      }

      if (starArray.length > numberOfStars) {
        for (let i = 0; i < newStars; i++) {
          starArray.splice(0, 1);
        }
      }

      fill(visColor);

      image(portada2, 0, 0, width, height);
      image(tw1_2, 0, 0, width, height);

      filters();

      if (millis() - time > 141500) {
        tw1_2 = tw2_2;
        filters();
      }

      if (millis() - time > 145000) {
        tw1_2 = tw3_2;
        filters();
      }

      if (millis() - time > 151000) {
        tw1_2 = tw1_3;
        filters();
      }

      if (millis() - time > 156500) {
        tw1_2 = tw4_2;
        filters();
      }

      if (millis() - time > 159000) {
        tw1_2 = tw5_2;
        filters();
      }
    }

    if (millis() - time > 165000) {
      background(bgColor);
      translate(width / 2, height / 2);

      for (let i = 0; i < numCircles; i++) {
        let radius = radii[i];
        let angle = angles[i];

        stroke(255, vib(30 + i, 0, 100));
        noFill();

        strokeWeight(
          map(i, 0, numCircles - 1, vib(60 + i, 0.1, 3), 1)
        );

        let k = 0;
        for (let a = 0; a < TWO_PI; a += PI / vib(90 + i, 0, 5, k++)) {
          let x1 = cos(a + angle) * radius;
          let y1 = sin(a + angle) * radius;

          let x2 = cos(a + angle + PI / 30) * radius;
          let y2 = sin(a + angle + PI / 30) * radius;

          line(x1, y1, x2, y2);
        }

        angles[i] += speeds[i];
      }

      stroke(starColor);
      fill(starColor);

      for (let i = 0; i < numStars; i++) {
        let xStar = cos(starAngles[i]) * starRadii[i];
        let yStar = sin(starAngles[i]) * starRadii[i];

        circle(xStar, yStar, vib(120, 0.1, 0.5, i));

        starAngles[i] += 0.0025;

        if (starAngles[i] > TWO_PI) {
          starAngles[i] -= TWO_PI;
        }
      }

      fill(0);
      ellipse(0, 0, 100, 100);

      image(
        silhouette,
        vib(5, -30 - width / 2, -width / 2),
        vib(6, -30 - height / 2, -height / 2),
        vib(7, width - 50, width),
        vib(8, height - 50, height)
      );

      filters();

      if (millis() - time > 185000) {
        silhouette = silhouette2;
        filters();
      }

      if (millis() - time > 192000) {
        silhouette = silhouette3;
        filters();
      }

      if (millis() - time > 199000) {
        silhouette = alpha;
        filters();
      }
    }

    filters();
  }

  filters();
}

function keyPressed() {
  if (canEnter == true) {
    if ((keyCode === ENTER || key === "Enter") && indiceCruz < maxEnter) {
      indiceCruz++;
    }
  }
}

let ctl = {};
function cacheControls() {
  ["bgColor","visColor","starColor","volumeI","vibI","posterize","blur","negative"]
    .forEach(id => ctl[id] = document.getElementById(id));
}

function leerControles() {
  bgColor = color(ctl.bgColor.value);
  visColor = color(ctl.visColor.value);
  starColor = color(ctl.starColor.value);

  volumeI = parseFloat(ctl.volumeI.value);
  vibAmp = parseFloat(ctl.vibI.value);

  posterize = ctl.posterize.checked;
  blur = ctl.blur.checked;
  negative = ctl.negative.checked;
}

// Ajusta el canvas al tamaño disponible (útil dentro de Wix).
// p5 corrige el mouse automáticamente cuando el canvas se escala con CSS.
function fitCanvas() {
  const c = document.querySelector("canvas");
  if (!c) return;
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  c.style.width = Math.floor(1920 * s) + "px";
  c.style.height = Math.floor(1080 * s) + "px";
}
function windowResized() { fitCanvas(); }

// El navegador solo permite audio tras un clic/toque del usuario.
function prepareStart() {
  const btn = document.getElementById("startBtn");
  setStartMsg("Listo. Haz clic para comenzar (se activará el sonido).");
  btn.style.display = "inline-block";
  btn.onclick = () => {
    const go = () => {
      audioReady = true;
      document.getElementById("startOverlay").style.display = "none";
    };
    userStartAudio().then(go).catch(go);
  };
}

function filters() {
  if (posterize == true) {
    filter(POSTERIZE, 4);
  }

  if (blur == true) {
    filter(BLUR, 4);
  }

  if (negative == true) {
    filter(INVERT);
  }
}
</script>

<script>
// Ventana de controles: arrastrable y ocultable
(function () {
  const panel = document.getElementById("controlFrame");
  const header = document.getElementById("controlHeader");
  const toggle = document.getElementById("panelToggle");
  const hideBtn = document.getElementById("controlHide");
  let dragging = false, offX = 0, offY = 0;

  function clampIntoView() {
    const maxX = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxY = Math.max(0, window.innerHeight - panel.offsetHeight);
    panel.style.left = Math.min(Math.max(0, panel.offsetLeft), maxX) + "px";
    panel.style.top = Math.min(Math.max(0, panel.offsetTop), maxY) + "px";
  }

  header.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    dragging = true;
    const r = panel.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const maxX = window.innerWidth - panel.offsetWidth;
    const maxY = window.innerHeight - panel.offsetHeight;
    panel.style.left = Math.min(Math.max(0, e.clientX - offX), Math.max(0, maxX)) + "px";
    panel.style.top = Math.min(Math.max(0, e.clientY - offY), Math.max(0, maxY)) + "px";
  });
  const stop = () => { dragging = false; };
  header.addEventListener("pointerup", stop);
  header.addEventListener("pointercancel", stop);

  toggle.addEventListener("click", () => {
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden")) clampIntoView();
  });
  hideBtn.addEventListener("click", () => panel.classList.add("hidden"));
  window.addEventListener("resize", clampIntoView);
})();
</script>

</body>
</html>
